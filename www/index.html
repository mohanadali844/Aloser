<style>

body{margin:0;font-family:'Segoe UI',Tahoma,Arial,sans-serif;background:var(--bg);color:var(--txt);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);min-height:100%}
header{position:sticky;top:8px;margin-top:8px;padding-top:env(safe-area-inset-top,0px);background:var(--pri);color:#fff;z-index:20;box-shadow:0 2px 6px rgba(0,0,0,.15);border-radius:0 0 14px 14px}
.hd{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;max-width:960px;margin:0 auto;position:relative;min-height:58px}

footer.note{font-size:11px;color:var(--sub);text-align:center;padding:16px}

<body>
<div id="app"></div>
<script>
const $=s=>document.querySelector(s),$$=s=>document.querySelectorAll(s);
function uid(){return 'id-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,8)}
function nowIso(){return new Date().toISOString()}
function fmt(d){return new Date(d).toLocaleString('ar-EG',{dateStyle:'short',timeStyle:'short'})}

// ============================================================
// الاتصال الحقيقي بـ Supabase — عدّل القيمتين التاليتين فقط إذا غيّرت المشروع
// ============================================================
const SUPABASE_URL='https://chwvxnqzgvfelyljmxtt.supabase.co';
const SUPABASE_ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNod3Z4bnF6Z3ZmZWx5bGpteHR0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY0NzQ1MzMsImV4cCI6MjEwMjA1MDUzM30.rHUz6adjQ6HYiKyKVg0ieNW0wrIokXZA-k2ItOlUMe8';
let supabaseClient=null;

// ذاكرة تخزين مؤقت في المتصفح (RAM) لنتائج قاعدة البيانات — تُحدَّث بعد كل عملية، وكل شاشات العرض تقرأ منها مباشرة
let _houses=[], _profiles=[];
function houses(){return _houses}
function users(){return _profiles}
async function loadProfiles(){
  const {data,error}=await supabaseClient.from('profiles').select('*').eq('active',true).eq('deleted',false).order('created_at');
  if(error){toast('تعذّر تحميل قائمة المستخدمين: '+error.message,true);return}
  _profiles=data||[];
}
async function loadHouses(){
  const {data,error}=await supabaseClient.from('houses').select('*, families(*)').order('created_at',{ascending:false});
  if(error){toast('تعذّر تحميل بيانات الأسر: '+error.message,true);return}
  _houses=(data||[]).map(h=>({...h, families:(h.families||[]).slice().sort((a,b)=>(a.family_number||0)-(b.family_number||0))}));
}
async function refreshAll(){await Promise.all([loadProfiles(),loadHouses()])}

let session=null;
let route='login', editHouseId=null, viewHouseId=null, detailReturnRoute='search';
let topClockTimer=null;
let editTargetHouseId=null, editTargetFamilyId=null, editFamilyDraft=null, editHouseFields=null;
// المدير يستطيع تعديل/حذف أي سجل، والباحث يستطيع ذلك فقط لسجلاته هو — وهذه المرة القاعدة نفسها مفروضة فعلياً
// في قاعدة البيانات عبر سياسات RLS (ملف supabase_schema.sql)، وليست فقط تحققاً شكلياً في الواجهة
function canEditFamily(h){return h && session && (session.role==='admin' || h.researcher_id===session.id)}
async function deleteFamily(hId,fId,afterRoute){
  const h=houses().find(x=>x.id===hId);
  if(!canEditFamily(h)){toast('ليست لديك صلاحية حذف هذا السجل',true);return}
  const f0=h.families.find(x=>x.id===fId);
  if(!confirm(`هل أنت متأكد من حذف بيانات أسرة «${f0?f0.head_name:''}» — رقم المنزل ${h.house_number}؟ لا يمكن التراجع عن هذا الإجراء.`))return;
  const {error}=await supabaseClient.from('families').delete().eq('id',fId);
  if(error){toast('تعذّر الحذف: '+error.message,true);return}
  if(h.families.length<=1){
    await supabaseClient.from('houses').delete().eq('id',hId); // آخر أسرة في المنزل → يُحذف المنزل معها تلقائياً
  }
  await refreshAll();
  toast('تم حذف بيانات الأسرة بنجاح');
  nav(afterRoute);
}
function startEditFamily(hId,fId,returnRoute){
  const h=houses().find(x=>x.id===hId);
  if(!canEditFamily(h)){toast('ليست لديك صلاحية تعديل هذا السجل',true);return}
  const f=h.families.find(x=>x.id===fId);
  editTargetHouseId=hId;editTargetFamilyId=fId;
  editHouseFields={house_number:h.house_number,block_number:h.block_number};
  editFamilyDraft=JSON.parse(JSON.stringify(f));
  detailReturnRoute=returnRoute;
  nav('editFamily');
}
let famDraft=[]; // مسودة الأسر أثناء الإضافة

function toast(msg,isErr){
  const t=document.createElement('div');t.className='toast'+(isErr?' err':'');t.textContent=msg;
  document.body.appendChild(t);setTimeout(()=>t.remove(),3000);
}

// ----- التحقق -----
function reqStr(v){return v!==undefined && v!==null && String(v).trim().length>0}
function reqNum(v){return v!==undefined && v!==null && String(v).trim()!=='' && !isNaN(v) && Number(v)>=0}

function validateHouse(h){
  const e={};
  if(!reqNum(h.house_number)) e.house_number='رقم المنزل مطلوب';
  return e;
}
function validateFamily(f){
  const e={};
  if(!reqStr(f.head_name)) e.head_name='اسم رب الأسرة مطلوب';
  if(!reqStr(f.phone)) e.phone='رقم الهاتف مطلوب';
  if(!reqNum(f.sons)) e.sons='عدد أفراد الأسرة مطلوب';
  if(!reqNum(f.males)) e.males='عدد الذكور مطلوب';
  if(!reqNum(f.females)) e.females='عدد الإناث مطلوب';
  if(!reqNum(f.under5)) e.under5='هذا الحقل مطلوب';
  if(!f.divorced) e.divorced='مطلوب';
  if(!f.widow) e.widow='مطلوب';
  if(!f.chronic_disease) e.chronic_disease='مطلوب';
  if(f.chronic_disease==='نعم'){
    if(!reqStr(f.chronic_disease_type)) e.chronic_disease_type='نوع المرض مطلوب';
    if(!f.treatment) e.treatment='مطلوب';
    if(f.treatment==='نعم' && !reqStr(f.treatment_type)){} // اختياري
  }
  if(!f.disability) e.disability='مطلوب';
  if(f.disability==='نعم' && (!f.disability_type || f.disability_type.length===0)) e.disability_type='اختر نوع إعاقة واحداً على الأقل';
  return e;
}

// ----- المسارات -----
function nav(r){route=r;render();window.scrollTo(0,0)}
async function logout(){
  await supabaseClient.auth.signOut();
  session=null;_houses=[];_profiles=[];
  nav('login');
}
// استعادة الجلسة الحقيقية من Supabase عند فتح الصفحة أو تحديثها (التوكن محفوظ بأمان بواسطة مكتبة supabase-js نفسها)
async function loadSessionProfile(authUser){
  const {data,error}=await supabaseClient.from('profiles').select('*').eq('id',authUser.id).single();
  if(error || !data || data.deleted || !data.active){
    await supabaseClient.auth.signOut();
    session=null;
    return false;
  }
  session={id:authUser.id,email:authUser.email,username:data.username||'',name:data.name,role:data.role};
  return true;
}
async function boot(){
  supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{
    auth:{
      persistSession:true,
      autoRefreshToken:true,
      detectSessionInUrl:false
    }
  });
  $('#app').innerHTML='<div class="login-wrap"><p class="muted">جارٍ الاتصال بقاعدة البيانات...</p></div>';
  const {data:{session:sbSession}}=await supabaseClient.auth.getSession();
  if(sbSession){
    const ok=await loadSessionProfile(sbSession.user);
    if(ok) await refreshAll();
  }
  route=session?'dashboard':'login';
  render();
}

function updateTopClock(){
  const el=$('#topClock');
  if(!el)return;
  const now=new Date();
  el.querySelector('.time').textContent=now.toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:true});
  el.querySelector('.date').textContent=now.toLocaleDateString('ar-EG',{weekday:'long',year:'numeric',month:'long',day:'numeric'});
}
function startTopClock(){
  if(topClockTimer)clearInterval(topClockTimer);
  updateTopClock();
  topClockTimer=setInterval(updateTopClock,1000);
}
function render(){
  const app=$('#app');
  if(!session){app.innerHTML=viewLogin();bindLogin();return}
  if(route==='login') route='dashboard'; // حماية إضافية: أي جلسة فعّالة تذهب للرئيسية وليس لشاشة الدخول
  app.innerHTML=layout();
  bindNav();
  const body=$('#body');
  if(route==='dashboard') body.innerHTML=viewDashboard();
  else if(route==='add') {body.innerHTML=viewAdd();bindAdd();}
  else if(route==='search'){body.innerHTML=viewSearch();bindSearch();}
  else if(route==='detail'){body.innerHTML=viewDetail();bindDetail();}
  else if(route==='neighborhood'){body.innerHTML=viewNeighborhood();bindNeighborhood();}
  else if(route==='editFamily'){body.innerHTML=viewEditFamily();bindEditFamily();}
  else if(route==='researchers'){body.innerHTML=viewResearchers();bindResearchers();}
  else if(route==='settings'){body.innerHTML=viewSettings();bindSettings();}
  if(window.lucide) lucide.createIcons();
  startTopClock();
}

      <div class="pw-wrap"><input id="password" type="password" autocomplete="current-password"><button type="button" id="togglePw">إظهار</button></div>
      <div class="err">مطلوبة</div>
    </div>
    <div id="loginErr" class="err" style="display:none;margin-top:8px"></div>

function bindLogin(){
  $('#togglePw').onclick=()=>{const p=$('#password');const show=p.type==='password';p.type=show?'text':'password';$('#togglePw').textContent=show?'إخفاء':'إظهار'};
  $('#loginBtn').onclick=async ()=>{
    const u=$('#username').value.trim(),p=$('#password').value;
    $('#f-u').classList.toggle('invalid',!u);
    $('#f-p').classList.toggle('invalid',!p);
    if(!u||!p)return;
    const errBox=$('#loginErr');errBox.style.display='none';
    const btn=$('#loginBtn');btn.disabled=true;btn.textContent='جارٍ الدخول...';
    const {data:lookup,error:lookupError}=await supabaseClient.rpc('get_login_email_by_username',{p_username:u.toLowerCase()});
    if(lookupError || !lookup){errBox.style.display='block';errBox.textContent='اسم المستخدم أو كلمة المرور غير صحيحة';btn.disabled=false;btn.textContent='دخول';return;}
    const {data,error}=await supabaseClient.auth.signInWithPassword({email:lookup,password:p});
    if(error){
      errBox.style.display='block';
      errBox.textContent=error.message==='Invalid login credentials'?'البريد الإلكتروني أو كلمة المرور غير صحيحة':error.message;
      btn.disabled=false;btn.textContent='دخول';return;
    }
    const ok=await loadSessionProfile(data.user);
    if(!ok){
      errBox.style.display='block';errBox.textContent='هذا الحساب معطّل أو محذوف. راجع المدير.';
      btn.disabled=false;btn.textContent='دخول';return;
    }
    await refreshAll();
    btn.disabled=false;btn.textContent='دخول';
    nav('dashboard');
  };
}

function renderFamList(){
  $('#famList').innerHTML=famDraft.map((f,i)=>familyForm(f,i,famDraft.length)).join('');
  $('#famCountShow').textContent=famDraft.length;
  bindFamEvents();
}
function bindFamEvents(){
  $$('.fam-box').forEach(box=>{
    const id=box.dataset.id;
    const f=famDraft.find(x=>x.id===id);
    box.querySelectorAll('[data-k]').forEach(inp=>{
      inp.oninput=inp.onchange=()=>{f[inp.dataset.k]=inp.value;
        if(inp.dataset.k==='chronic_disease'){box.querySelector('.chronicBox').style.display=inp.value==='نعم'?'block':'none';}
        if(inp.dataset.k==='treatment'){box.querySelector('.treatBox').style.display=inp.value==='نعم'?'block':'none';}
        if(inp.dataset.k==='disability'){box.querySelector('.disBox').style.display=inp.value==='نعم'?'block':'none';}
      };
    });
    box.querySelectorAll('[data-chip]').forEach(ch=>{
      ch.onclick=()=>{
        const t=ch.dataset.chip;const i=f.disability_type.indexOf(t);
        if(i>-1)f.disability_type.splice(i,1);else f.disability_type.push(t);
        ch.classList.toggle('on');
      };
    });
    const rm=box.querySelector('.removeFam');
    if(rm) rm.onclick=()=>{famDraft=famDraft.filter(x=>x.id!==id);renderFamList()};
  });
}
function bindAdd(){
  renderFamList();
  $('#addFamBtn').onclick=()=>{famDraft.push(newFamily());renderFamList()};
  $('#saveHouseBtn').onclick=async ()=>{
    if($('#saveHouseBtn').disabled) return;
    const house={house_number:$('#house_number').value,block_number:$('#block_number').value};
    const hErr=validateHouse(house);
    $('#f-house_number').classList.toggle('invalid',!!hErr.house_number);
    if(hErr.house_number) $('#f-house_number .err').textContent=hErr.house_number;
    let ok=!hErr.house_number;
    famDraft.forEach(f=>{
      const fe=validateFamily(f);
      const box=document.querySelector(`.fam-box[data-id="${f.id}"]`);
      box.querySelectorAll('.field').forEach(fl=>{
        const key=fl.dataset.f;
        if(fe[key]){fl.classList.add('invalid');fl.querySelector('.err').textContent=fe[key];ok=false;}
        else fl.classList.remove('invalid');
      });
    });
    if(!ok){toast('يرجى تصحيح الحقول المميزة باللون الأحمر',true);return}
    const btn=$('#saveHouseBtn');
    btn.disabled=true;btn.textContent='جارٍ الحفظ في قاعدة البيانات...';
    try{
      const {data:houseRow,error:hErr2}=await supabaseClient.from('houses').insert({
        house_number:house.house_number, block_number:house.block_number||null,
        researcher_id:session.id, researcher_name:session.name
      }).select().single();
      if(hErr2) throw hErr2;
      const total=famDraft.length;
      const payload=famDraft.map((f,i)=>({
        house_id:houseRow.id,
        family_number: total>1?(i+1):null,
        head_name:f.head_name, phone:f.phone,
        sons:Number(f.sons)||0, males:Number(f.males)||0, females:Number(f.females)||0, under5:Number(f.under5)||0,
        divorced:f.divorced, widow:f.widow, chronic_disease:f.chronic_disease,
        chronic_disease_type: f.chronic_disease==='نعم' ? (f.chronic_disease_type||null) : null,
        treatment: f.chronic_disease==='نعم' ? (f.treatment||null) : null,
        treatment_type: (f.chronic_disease==='نعم' && f.treatment==='نعم') ? (f.treatment_type||null) : null,
        disability:f.disability,
        disability_type: f.disability==='نعم' ? f.disability_type : null,
        notes:f.notes||null, sync_status:'synced', created_by:session.id
      }));
      const {error:fErr}=await supabaseClient.from('families').insert(payload);
      if(fErr) throw fErr;
      famDraft=[];
      await refreshAll();
      toast('تم حفظ السجل بنجاح في قاعدة البيانات ('+total+' أسرة)');
      nav('search');
    }catch(err){
      console.error(err);
      toast('تعذّر الحفظ: '+(err.message||'خطأ غير معروف، تحقق من اتصالك بالإنترنت'),true);
      btn.disabled=false;btn.innerHTML=icon('save')+' حفظ السجل';if(window.lucide)lucide.createIcons();
    }
  };
}

const PDF_MARGIN_MM=8; // هامش آمن موحّد على الجهات الأربع لجميع ملفات PDF المُصدَّرة
async function buildPdf({rows,columns,title,filename,orientation,rowsPerPage}){
  if(document.fonts && document.fonts.ready) await document.fonts.ready; // ضمان اكتمال تحميل خط Cairo قبل أي قياس أو التقاط، لتفادي قصّ الأعمدة
  const { jsPDF } = window.jspdf;
  const pdf=new jsPDF({orientation,unit:'mm',format:'a4'});
  const pageW=pdf.internal.pageSize.getWidth(), pageH=pdf.internal.pageSize.getHeight();
  const availW=pageW-PDF_MARGIN_MM*2, availH=pageH-PDF_MARGIN_MM*2;
  const pages=chunk(rows,rowsPerPage);
  const genDate=new Date().toLocaleString('ar-EG',{dateStyle:'long',timeStyle:'short'});
  // عرض كل عمود محسوب مسبقاً وثابت (بدل القياس التلقائي الذي كان يتأثر بتأخر تحميل الخط) — يضمن عرضاً كلياً معروفاً للجدول ولا يقصّ أي عمود
  const totalWidthPx = columns.reduce((s,c)=>s+(c.width||90),0);
  let root=document.getElementById('pdfExportRoot');
  if(root) root.remove();
  root=document.createElement('div');root.id='pdfExportRoot';document.body.appendChild(root);
  for(let i=0;i<pages.length;i++){
    const pageRows=pages[i];
    const div=document.createElement('div');
    div.className='pdfPage';
    div.style.width=totalWidthPx+'px';
    div.innerHTML=`
      <h2>${title}</h2>
      <div class="pmeta">تاريخ الإنشاء: ${genDate} — عدد السجلات الكلي: ${rows.length} — صفحة ${i+1} من ${pages.length}</div>
      <table>
        <colgroup>${columns.map(c=>`<col style="width:${c.width||90}px">`).join('')}</colgroup>
        <thead><tr>${columns.map(c=>`<th class="${c.wrap?'wrap':''}">${c.label}</th>`).join('')}</tr></thead>
        <tbody>${pageRows.map(({h,f})=>`<tr>${columns.map(c=>`<td class="${c.wrap?'wrap':''}">${(c.get(h,f)??'-')||'-'}</td>`).join('')}</tr>`).join('')}</tbody>
      </table>
      <div class="pfoot">نظام حصر الأسر — ملف مُصدَّر آلياً — صفحة ${i+1}/${pages.length}</div>`;
    root.appendChild(div);
    const canvas=await html2canvas(div,{scale:2,backgroundColor:'#ffffff',width:totalWidthPx,windowWidth:totalWidthPx});
    const imgData=canvas.toDataURL('image/png');
    const ratio=canvas.height/canvas.width;
    let imgW=availW, imgH=imgW*ratio;
    if(imgH>availH){imgH=availH;imgW=imgH/ratio;} // تصغير إضافي إن كان الصف طويلاً جداً حتى لا يخرج عن هامش الصفحة السفلي
    const x=PDF_MARGIN_MM+(availW-imgW)/2, y=PDF_MARGIN_MM;
    if(i>0) pdf.addPage();
    pdf.addImage(imgData,'PNG',x,y,imgW,imgH);
    root.removeChild(div);
  }
  root.remove();
  pdf.save(filename);
}
// PDF مخصّص لأسرة واحدة فقط: جدول عمودين بالطول (اسم الحقل يميناً / الإجابة يساراً)، صف مستقل لكل حقل
async function buildSingleFamilyPdf(h,f){
  if(document.fonts && document.fonts.ready) await document.fonts.ready;
  const { jsPDF } = window.jspdf;
  const pdf=new jsPDF({orientation:'p',unit:'mm',format:'a4'});
  const pageW=pdf.internal.pageSize.getWidth(), pageH=pdf.internal.pageSize.getHeight();
  const availW=pageW-PDF_MARGIN_MM*2, availH=pageH-PDF_MARGIN_MM*2;
  const rowsPerPage=20;
  const chunks=chunk(SURVEY_COLUMNS,rowsPerPage);
  const genDate=new Date().toLocaleString('ar-EG',{dateStyle:'long',timeStyle:'short'});
  const pagePadding=14; // هامش داخلي صغير ومتوازن داخل صفحة PDF
  const tableWidthPx=660, labelWidthPx=200; // مجموع عرضي العمودين = عرض الجدول الفعلي تماماً، بلا أي فارق يفرض تصغيراً تناسبياً
  const totalWidthPx=tableWidthPx+pagePadding*2;
  let root=document.getElementById('pdfExportRoot');
  if(root) root.remove();
  root=document.createElement('div');root.id='pdfExportRoot';document.body.appendChild(root);
  for(let i=0;i<chunks.length;i++){
    const div=document.createElement('div');
    div.className='pdfPage';
    div.dir='rtl';
    div.style.width=totalWidthPx+'px';
    div.innerHTML=`
      <h2>بيانات الأسرة</h2>
      <div class="pmeta">رقم المنزل: ${h.house_number} — اسم رب الأسرة: ${f.head_name} — تاريخ الإنشاء: ${genDate} — صفحة ${i+1} من ${chunks.length}</div>
      <table class="field-table" dir="rtl" style="width:${tableWidthPx}px">
        <colgroup><col style="width:${labelWidthPx}px"><col style="width:${tableWidthPx-labelWidthPx}px"></colgroup>
        <thead><tr><th class="flabel">البيان</th><th>الإجابة</th></tr></thead>
        <tbody>${chunks[i].map(c=>`<tr><td class="flabel">${c.label}</td><td class="fval wrap">${(c.get(h,f)??'-')||'-'}</td></tr>`).join('')}</tbody>
      </table>
      <div class="pfoot">نظام حصر الأسر — بيانات أسرة — صفحة ${i+1}/${chunks.length}</div>`;
    root.appendChild(div);
    const canvas=await html2canvas(div,{scale:2,backgroundColor:'#ffffff',width:totalWidthPx,windowWidth:totalWidthPx});
    const imgData=canvas.toDataURL('image/png');
    const ratio=canvas.height/canvas.width;
    let imgW=availW, imgH=imgW*ratio;
    if(imgH>availH){imgH=availH;imgW=imgH/ratio;}
    const x=PDF_MARGIN_MM+(availW-imgW)/2, y=PDF_MARGIN_MM;
    if(i>0) pdf.addPage();
    pdf.addImage(imgData,'PNG',x,y,imgW,imgH);
    root.removeChild(div);
  }
  root.remove();
  pdf.save(`بيانات_أسرة_منزل_${h.house_number}${f.family_number?('_'+f.family_number):''}.pdf`);
}

      <button class="btn sm" id="modalPdfBtn">${icon('file-down',14)} حفظ PDF</button>
    </div>
  </div>`;
  document.body.appendChild(overlay);
  overlay.onclick=(e)=>{if(e.target===overlay) closeFamilyModal()};
  $('#modalCloseBtn').onclick=closeFamilyModal;

}

function bindEditFamily(){

  box.querySelectorAll('[data-k]').forEach(inp=>{
    inp.oninput=inp.onchange=()=>{editFamilyDraft[inp.dataset.k]=inp.value;
      if(inp.dataset.k==='chronic_disease'){box.querySelector('.chronicBox').style.display=inp.value==='نعم'?'block':'none';}
      if(inp.dataset.k==='treatment'){box.querySelector('.treatBox').style.display=inp.value==='نعم'?'block':'none';}
      if(inp.dataset.k==='disability'){box.querySelector('.disBox').style.display=inp.value==='نعم'?'block':'none';}
    };
  });
  box.querySelectorAll('[data-chip]').forEach(ch=>{
    ch.onclick=()=>{
      const t=ch.dataset.chip;const i=editFamilyDraft.disability_type.indexOf(t);

    $('#ef-house_number').classList.toggle('invalid',!!hErr.house_number);

    let ok=!hErr.house_number;
    const fe=validateFamily(editFamilyDraft);
    box.querySelectorAll('.field').forEach(fl=>{
      const key=fl.dataset.f;
      if(fe[key]){fl.classList.add('invalid');fl.querySelector('.err').textContent=fe[key];ok=false;}
      else fl.classList.remove('invalid');
    });
    if(!ok){toast('يرجى تصحيح الحقول المميزة باللون الأحمر',true);return}
    const hh=houses().find(x=>x.id===editTargetHouseId);
    if(!canEditFamily(hh)){toast('ليست لديك صلاحية تعديل هذا السجل',true);return}
    btn.disabled=true;btn.textContent='جارٍ الحفظ...';
    try{
      const {error:hErr2}=await supabaseClient.from('houses').update({house_number:house.house_number,block_number:house.block_number||null}).eq('id',editTargetHouseId);
      if(hErr2) throw hErr2;
      const f=editFamilyDraft;
      const payload={
        head_name:f.head_name, phone:f.phone,
        sons:Number(f.sons)||0, males:Number(f.males)||0, females:Number(f.females)||0, under5:Number(f.under5)||0,
        divorced:f.divorced, widow:f.widow, chronic_disease:f.chronic_disease,

        treatment: f.chronic_disease==='نعم' ? (f.treatment||null) : null,
        treatment_type: (f.chronic_disease==='نعم' && f.treatment==='نعم') ? (f.treatment_type||null) : null,
        disability:f.disability, disability_type: f.disability==='نعم' ? f.disability_type : null,
        notes:f.notes||null, updated_by:session.name
      };
      const {error:fErr}=await supabaseClient.from('families').update(payload).eq('id',editTargetFamilyId);
      if(fErr) throw fErr;
      await refreshAll();
      toast('تم حفظ التعديلات بنجاح في قاعدة البيانات');
      viewHouseId=editTargetHouseId;editHouseId=editTargetFamilyId;
      nav('detail');
    }catch(err){

      btn.disabled=false;btn.innerHTML=icon('save')+' حفظ التعديلات';if(window.lucide)lucide.createIcons();
    }
  };
}

function viewDetail(){
  const h=houses().find(x=>x.id===viewHouseId);
  if(!h) return '<div class="card"><p class="empty">السجل غير موجود</p></div>';
  const f=h.families.find(x=>x.id===editHouseId);
  return `<div class="card">
    <button class="btn sec sm" id="backBtn">← رجوع</button>
    <h3>منزل رقم ${h.house_number} ${h.block_number?('- مربع '+h.block_number):''}</h3>
    <p class="muted">الباحث: ${h.researcher_name} • أُنشئ: ${fmt(h.created_at)} • آخر تعديل: ${fmt(h.updated_at)}</p>
    <span class="badge ${f.sync_status==='synced'?'b-ok':'b-warn'}">${f.sync_status==='synced'?'متزامن':'بانتظار المزامنة'}</span>
    ${f.updated_by?`<p class="muted">آخر تعديل بواسطة: ${f.updated_by} — ${fmt(f.updated_at)}</p>`:''}
    <div style="margin-top:10px">
      <button class="btn sm" onclick="window.print()">${icon('printer',14)} طباعة</button>
      ${canEditFamily(h)?`<button class="btn sm sec" id="detEditBtn">${icon('pencil',14)} تعديل</button><button class="btn sm danger" id="detDelBtn">${icon('trash-2',14)} حذف</button>`:''}
    </div>
    <hr style="border-color:var(--bd);margin:14px 0">
    <table>
      ${f.family_number?`<tr><th>رقم الأسرة</th><td>${f.family_number}</td></tr>`:''}
      <tr><th>اسم رب الأسرة</th><td>${f.head_name}</td></tr>
      <tr><th>رقم الهاتف</th><td>${f.phone}</td></tr>
      <tr><th>عدد أفراد الأسرة</th><td>${f.sons}</td></tr>
      <tr><th>عدد الذكور</th><td>${f.males}</td></tr>
      <tr><th>عدد الإناث</th><td>${f.females}</td></tr>
      <tr><th>أطفال دون 5 سنوات</th><td>${f.under5}</td></tr>
      <tr><th>مطلقة ضمن الأسرة</th><td>${f.divorced}</td></tr>
      <tr><th>أرمل/أرملة ضمن الأسرة</th><td>${f.widow}</td></tr>
      <tr><th>مرض مزمن</th><td>${f.chronic_disease}${f.chronic_disease==='نعم'?' - '+f.chronic_disease_type:''}</td></tr>
      ${f.chronic_disease==='نعم'?`<tr><th>يتلقى علاجاً</th><td>${f.treatment}${f.treatment==='نعم'&&f.treatment_type?' - '+f.treatment_type:''}</td></tr>`:''}
      <tr><th>إعاقة</th><td>${f.disability}${f.disability==='نعم'?' - '+f.disability_type.join('، '):''}</td></tr>
      <tr><th>ملاحظات</th><td>${f.notes||'-'}</td></tr>
    </table>
  </div>`;
}
function bindDetail(){
  $('#backBtn').onclick=()=>nav(detailReturnRoute);
  const editBtn=$('#detEditBtn'), delBtn=$('#detDelBtn');
  if(editBtn) editBtn.onclick=()=>startEditFamily(viewHouseId,editHouseId,detailReturnRoute);
  if(delBtn) delBtn.onclick=()=>deleteFamily(viewHouseId,editHouseId,detailReturnRoute);
}

// ===== إدارة الباحثين والمديرين (مدير فقط) =====
let editingUserId=null;
const ROLE_LABEL={admin:'مدير',researcher:'باحث'};
function jobTitleSelect(id,selected){
  return `<select id="${id}"><option value="researcher" ${selected==='researcher'?'selected':''}>باحث</option><option value="admin" ${selected==='admin'?'selected':''}>مدير</option></select>`;
}
function viewResearchers(){
  if(session.role!=='admin') return '<div class="card"><p class="empty">هذه الصفحة للمدير فقط</p></div>';
  const list=users();
  const H=houses();
  const editingUser=editingUserId? list.find(u=>u.id===editingUserId):null;
  const isSelf=editingUser && editingUser.id===session.id;
  return `
  <div class="card">
    ${editingUser?`
      <h3 style="margin-top:0">تعديل بيانات المستخدم</h3>
      <div class="field" id="f-eu"><label>الاسم الكامل</label><input id="editName" value="${editingUser.name}"><div class="err">مطلوب</div></div>
      <label>البريد الإلكتروني</label>
      <input value="${editingUser.email||''}" disabled>
      <p class="muted">لا يمكن تغيير البريد الإلكتروني لحساب آخر من هنا (قيد تقني من Supabase Auth على الواجهة الأمامية).</p>
      <label>المسمى الوظيفي</label>
      ${jobTitleSelect('editRole',editingUser.role)}
      ${isSelf?`
        <label>كلمة مرور جديدة (اختياري — اتركه فارغاً لعدم التغيير)</label>
        <input id="editPass" type="text">
      `:`
        <div class="field" style="margin-top:10px">
          <label>كلمة المرور</label>
          <button type="button" class="btn sec sm" id="sendResetBtn">${icon('mail',14)} إرسال رابط إعادة تعيين كلمة المرور بالبريد</button>
          <p class="muted">لا يمكن تعيين كلمة مرور لمستخدم آخر مباشرة من المتصفح لأسباب أمنية؛ هذا يرسل له رابطاً آمناً عبر Supabase ليضع كلمة مروره بنفسه.</p>
        </div>
      `}
      <div style="margin-top:10px;display:flex;gap:8px">
        <button class="btn" id="saveUserBtn">${icon('save',16)} حفظ التعديلات</button>
        <button class="btn sec" id="cancelEditUserBtn">إلغاء</button>
      </div>
    `:`
      <h3 style="margin-top:0">إضافة مستخدم جديد</h3>
      <p class="muted">اسم المستخدم للدخول فقط، بينما الاسم الكامل هو الذي يظهر داخل النظام وفي المعاملات. البريد الإلكتروني يبقى مرتبطاً بحساب Supabase Auth.</p>
      <div class="row2">
        <div class="field" id="f-nun"><label>اسم المستخدم</label><input id="newUsername" type="text" autocomplete="off"><div class="err">مطلوب — يجب أن يكون فريداً</div></div>
        <div class="field" id="f-nu"><label>الاسم الكامل</label><input id="newName"><div class="err">مطلوب</div></div>
      </div>
      <div class="row2">
        <div class="field" id="f-ne"><label>البريد الإلكتروني</label><input id="newUser" type="email"><div class="err">مطلوب / غير صالح</div></div>
        <div></div>
      </div>
      <div class="row2">
        <div class="field" id="f-np"><label>كلمة مرور مبدئية</label><input id="newPass" type="text"><div class="err">6 أحرف على الأقل</div></div>
        <div class="field"><label>المسمى الوظيفي</label>${jobTitleSelect('newRole','researcher')}</div>
      </div>
      <button class="btn" id="addResBtn" style="margin-top:10px">${icon('user-plus')} إضافة المستخدم</button>
    `}
  </div>
  <div class="card">
    <h3 style="margin-top:0">المستخدمون (${list.length})</h3>
    <div class="tblwrap"><table>
      <tr><th>الاسم</th><th>البريد الإلكتروني</th><th>المسمى الوظيفي</th><th>عدد السجلات</th><th>الحالة</th><th></th></tr>
      ${list.map(u=>{
        const cnt=H.filter(h=>h.researcher_id===u.id).reduce((s,h)=>s+h.families.length,0);
        const statusLabel=u.deleted?'محذوف':(u.active?'مفعّل':'معطّل');
        const statusClass=u.deleted?'b-warn':(u.active?'b-ok':'b-warn');
        return `<tr>
          <td>${u.name}</td><td>${u.email||'-'}</td><td>${ROLE_LABEL[u.role]||u.role}</td><td>${cnt}</td>
          <td><span class="badge ${statusClass}">${statusLabel}</span></td>
          <td style="white-space:nowrap">
            ${u.deleted?'<span class="muted">لا إجراءات</span>':`
            <button class="btn sm sec editUserBtn" data-id="${u.id}" style="display:inline-flex">${icon('pencil',14)} تعديل</button>
            <button class="btn sm danger delUserBtn" data-id="${u.id}" style="display:inline-flex">${icon('trash-2',14)} حذف</button>`}
          </td>
        </tr>`;
      }).join('')}
    </table></div>
    ${list.length===0?'<p class="empty">لا يوجد مستخدمون بعد</p>':''}
    <p class="muted" style="margin-top:8px">«حذف» هنا يُعطّل الحساب منطقياً (Soft Delete) دائماً ولا يحذف الحساب نهائياً من نظام المصادقة — حذف حساب مصادقة نهائياً يتطلب صلاحيات خادم غير متاحة من المتصفح لأسباب أمنية.</p>
  </div>`;
}
async function bindResearchers(){
  if(session.role!=='admin') return;
  const addBtn=$('#addResBtn');
  if(addBtn) addBtn.onclick=async ()=>{
    const username=$('#newUsername').value.trim().toLowerCase(),name=$('#newName').value.trim(),email=$('#newUser').value.trim(),pass=$('#newPass').value,role=$('#newRole').value;
    const emailOk=/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
    const userOk=/^[a-z0-9._-]{3,30}$/.test(username);
    $('#f-nun').classList.toggle('invalid',!userOk);
    $('#f-nu').classList.toggle('invalid',!name);
    $('#f-ne').classList.toggle('invalid',!emailOk);
    $('#f-np').classList.toggle('invalid',pass.length<6);
    if(!userOk||!name||!emailOk||pass.length<6){toast('يرجى تصحيح الحقول',true);return}

    addBtn.disabled=true;addBtn.textContent='جارٍ الإنشاء...';

    // حفظ جلسة المدير الحالية قبل signUp لأن Supabase قد يستبدل جلسة المتصفح بالمستخدم الجديد.
    const {data:{session:adminSession}}=await supabaseClient.auth.getSession();
    if(!adminSession || !session || session.role!=='admin'){
      toast('تعذّر التحقق من جلسة المدير الحالية',true);
      addBtn.disabled=false;addBtn.innerHTML=icon('user-plus')+' إضافة المستخدم';
      if(window.lucide)lucide.createIcons();
      return;
    }

    try{
      const {data,error}=await supabaseClient.auth.signUp({
        email,
        password:pass,
        options:{data:{username,name,role:(role==='admin'?'admin':'researcher')}}
      });

      if(error) throw error;

      // إعادة جلسة المدير فوراً؛ لا نخرج المدير من النظام بعد إنشاء الباحث.
      await supabaseClient.auth.signOut();
      const {error:restoreError}=await supabaseClient.auth.setSession({
        access_token:adminSession.access_token,
        refresh_token:adminSession.refresh_token
      });
      if(restoreError) throw restoreError;

      const ok=await loadSessionProfile(adminSession.user);
      if(!ok) throw new Error('تعذّر استعادة جلسة المدير بعد إنشاء المستخدم.');

      await refreshAll();
      editingUserId=null;
      toast('تم إنشاء المستخدم بنجاح، وتم إبقاؤك داخل النظام كمدير.');
      nav('researchers');
    }catch(err){
      console.error(err);
      toast('تعذّر إنشاء الحساب: '+(err.message||'خطأ غير معروف'),true);
    }finally{
      addBtn.disabled=false;
      addBtn.innerHTML=icon('user-plus')+' إضافة المستخدم';
      if(window.lucide)lucide.createIcons();
    }
  };
  const saveBtn=$('#saveUserBtn');
  if(saveBtn) saveBtn.onclick=async ()=>{
    const name=$('#editName').value.trim(),role=$('#editRole').value;
    $('#f-eu').classList.toggle('invalid',!name);
    if(!name){toast('يرجى تصحيح الحقول',true);return}
    const editingUser=users().find(u=>u.id===editingUserId);
    const isSelf=editingUser.id===session.id;
    const newPass=isSelf? ($('#editPass')?$('#editPass').value:'') : '';
    if(newPass && newPass.length<6){toast('كلمة المرور الجديدة قصيرة جداً (6 أحرف على الأقل)',true);return}
    saveBtn.disabled=true;saveBtn.textContent='جارٍ الحفظ...';
    try{
      const {error}=await supabaseClient.from('profiles').update({name,role:(role==='admin'?'admin':'researcher')}).eq('id',editingUserId);
      if(error) throw error;
      if(isSelf && newPass){
        const {error:pErr}=await supabaseClient.auth.updateUser({password:newPass});
        if(pErr) throw pErr;
      }
      await refreshAll();
      if(isSelf) session.name=name; // تحديث اسم الجلسة الحالية فوراً في الواجهة
      toast('تم حفظ تعديلات المستخدم بنجاح');
      editingUserId=null;nav('researchers');
    }catch(err){
      console.error(err);
      toast('تعذّر حفظ التعديلات: '+(err.message||'خطأ غير معروف'),true);
      saveBtn.disabled=false;saveBtn.innerHTML=icon('save',16)+' حفظ التعديلات';if(window.lucide)lucide.createIcons();
    }
  };
  const resetBtn=$('#sendResetBtn');
  if(resetBtn) resetBtn.onclick=async ()=>{
    const editingUser=users().find(u=>u.id===editingUserId);
    resetBtn.disabled=true;resetBtn.textContent='جارٍ الإرسال...';
    const {error}=await supabaseClient.auth.resetPasswordForEmail(editingUser.email);
    if(error) toast('تعذّر إرسال الرابط: '+error.message,true);
    else toast('تم إرسال رابط إعادة تعيين كلمة المرور إلى '+editingUser.email);
    resetBtn.disabled=false;resetBtn.innerHTML=icon('mail',14)+' إرسال رابط إعادة تعيين كلمة المرور بالبريد';if(window.lucide)lucide.createIcons();
  };
  const cancelBtn=$('#cancelEditUserBtn');
  if(cancelBtn) cancelBtn.onclick=()=>{editingUserId=null;nav('researchers')};
  $$('.editUserBtn').forEach(b=>b.onclick=()=>{editingUserId=b.dataset.id;nav('researchers')});
  $$('.delUserBtn').forEach(b=>b.onclick=async ()=>{
    const u=users().find(x=>x.id===b.dataset.id);
    const hasRecords=houses().some(h=>h.researcher_id===u.id);
    if(!confirm(`هل أنت متأكد من حذف المستخدم «${u.name}»؟ سيتم تعطيل حسابه منطقياً (لن يستطيع الدخول بعدها)${hasRecords?'، مع الحفاظ الكامل على سجلات الأسر المرتبطة به.':'.'}`))return;
    const {error}=await supabaseClient.from('profiles').update({deleted:true,active:false}).eq('id',u.id);
    if(error){toast('تعذّر الحذف: '+error.message,true);return}
    await refreshAll();
    toast('تم تعطيل حساب المستخدم منطقياً — سجلات الأسر المرتبطة به محفوظة كما هي');
  });
}
